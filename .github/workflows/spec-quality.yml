name: spec-quality

on:
  pull_request:
    paths:
      - "genie_factory/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/spec-quality.yml"
  push:
    branches:
      - main

jobs:
  test:
    name: pytest (engine + 88-spec invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Pin the data anchor for reproducible builds; the rolling
      # behavior is verified separately by Phase 0 engine tests.
      GENIE_FACTORY_END_DATE: "2026-05-19"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          pip install -e .

      - name: Run engine unit tests
        run: pytest tests/test_engine_upgrades.py tests/test_validators.py tests/test_results.py tests/test_boolean_arithmetic.py -v

      - name: Run 88-spec invariant suite
        run: pytest tests/test_spec_quality.py -v

      - name: Smoke-build SQL for every spec
        run: |
          python -c "
          import json
          from pathlib import Path
          from genie_factory.generator import DomainSpec
          from genie_factory.data import build_table_sqls_from_spec, build_metric_view_sqls_from_spec
          errors = []
          for sp in sorted(Path('genie_factory/specs').glob('*/*.json')):
              try:
                  spec = DomainSpec.from_dict(json.loads(sp.read_text()))
                  build_table_sqls_from_spec(spec, 'cat.sch', seed=42, scale=3, target_rows=5000)
                  build_metric_view_sqls_from_spec(spec, 'cat.sch')
              except Exception as e:
                  errors.append(f'{sp.parent.name}/{sp.stem}: {e!r}'[:200])
          if errors:
              print('SPEC BUILD FAILURES:')
              for e in errors: print(' ', e)
              raise SystemExit(1)
          print('All 88 specs build clean.')
          "
